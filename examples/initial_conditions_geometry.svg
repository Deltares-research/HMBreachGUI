<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title description">
  <title id="title">Initial conditions relative to the coordinate-defined breach geometry</title>
  <desc id="description">The initial solver bed point is X zero, z minus 0.5 metres. The clipped input polyline begins at this point after a vertical offset of minus 0.5 metres. The 0.55 metre material profile extends below it. An inlet-state diagram lists the initial depth, velocity, concentration, discharge and Froude number for coordinate_geometry_input.json.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#222"/>
    </marker>
    <marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0072B2"/>
    </marker>
  </defs>
  <rect width="1280" height="900" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#222">
    <text x="40" y="38" font-size="24" font-weight="bold">Initial conditions and breach geometry</text>
    <text x="40" y="65" font-size="15">Example: coordinate_geometry_input.json with Fr0 = 2; initial state, not the calculated downstream flow</text>

    <text x="50" y="111" font-size="18" font-weight="bold">Geometry in solver coordinates</text>
    <text x="50" y="135" font-size="14">Equal horizontal and vertical scales; z positive upwards</text>
    <path d="M155 180 H590" stroke="#777" stroke-dasharray="6 4"/>
    <text x="300" y="170" font-size="14">Solver elevation datum z = 0</text>
    <path d="M200 205 V180 H585" fill="none" stroke="#222" marker-end="url(#arrow)"/>
    <text x="595" y="185" font-size="14">X (m)</text>
    <path d="M200 180 V150" stroke="#222" marker-end="url(#arrow)"/>
    <text x="183" y="148" font-size="14">z</text>
    <path d="M200 180 V430" stroke="#999" stroke-dasharray="3 5"/>
    <path d="M105 186 V424" stroke="#222" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M98 180 H190 M98 430 H190" stroke="#777"/>
    <text x="65" y="305" font-size="15" text-anchor="middle" transform="rotate(-90 65 305)">d_br,0 = 0.50 m (initial bed offset)</text>
    <text x="240" y="285" font-size="14">d_br,0 sets the initial sediment supply.</text>
    <text x="240" y="308" font-size="14">It is not the mixture depth h0 and</text>
    <text x="240" y="331" font-size="14">is not one of the layers below.</text>

    <polygon points="145,430 200,430 300,530 321.43,555 145,555" fill="#e8cb91"/>
    <polygon points="145,555 321.43,555 450,705 145,705" fill="#d5aa68"/>
    <path d="M200 430 L300 530 L450 705" stroke="#0072B2" stroke-width="4" fill="none"/>
    <path d="M145 555 H321.43" stroke="#806B47" stroke-width="2"/>
    <circle cx="200" cy="430" r="6" fill="#0072B2"/>
    <circle cx="300" cy="530" r="5" fill="#0072B2"/>
    <circle cx="321.43" cy="555" r="4" fill="#806B47"/>
    <circle cx="450" cy="705" r="5" fill="#0072B2"/>
    <text x="220" y="414" font-size="15" font-weight="bold">Inlet: X0 = 0, z0 = -0.50 m, s0 = 0</text>
    <path d="M223 438 L277 492" stroke="#0072B2" stroke-width="3" marker-end="url(#flow)"/>
    <text x="293" y="468" font-size="14" fill="#0072B2">u0, increasing s</text>
    <path d="M308 530 H355" stroke="#777"/>
    <text x="365" y="523" font-size="13">Vertex: (0.20, -0.70) m</text>
    <text x="365" y="544" font-size="13">alpha: 45 to 49.40 degrees</text>
    <text x="155" y="509" font-size="13">250 um</text>
    <text x="155" y="644" font-size="13">200 um</text>
    <path d="M330 558 L365 583" stroke="#777"/>
    <text x="375" y="590" font-size="13">Material boundary: z = -0.75 m</text>
    <text x="375" y="611" font-size="13">First thickness = 0.25 m</text>
    <text x="150" y="752" font-size="14">End: X = 0.50 m, z = -1.05 m.</text>
    <text x="150" y="778" font-size="14">Second thickness = 0.30 m; total below inlet = 0.55 m.</text>
    <text x="150" y="804" font-size="14">Vertex at depth 0.20 m splits the first material.</text>

    <rect x="690" y="100" width="550" height="350" rx="8" fill="#f3f8fc" stroke="#9ab6c9"/>
    <text x="715" y="131" font-size="19" font-weight="bold">Initial mixture state at the inlet</text>
    <text x="715" y="160" font-size="14">Schematic section (not to scale; no depth projection implied)</text>
    <path d="M735 250 H1175 M735 310 H1175" stroke="#0072B2" stroke-width="2"/>
    <rect x="735" y="251" width="440" height="58" fill="#b9ddf1"/>
    <path d="M750 257 V303" stroke="#222" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="765" y="286" font-size="15">h0 = 0.0117422 m</text>
    <path d="M970 279 H1140" stroke="#0072B2" stroke-width="3" marker-end="url(#flow)"/>
    <text x="965" y="236" font-size="15">u0 = 0.255488 m/s</text>
    <text x="735" y="341" font-size="15">c0 = 0.10 (10% sand by volume); Fr0 = 2.0</text>
    <text x="735" y="369" font-size="15">q0 = u0 h0 = 0.003 m2/s (per unit width)</text>
    <text x="735" y="397" font-size="15">sz0 = rho_s q0 c0 = 0.795 kg/(s m)</text>
    <text x="735" y="425" font-size="15">B-Constant: b0 = 1 m; Q0 = 0.003 m3/s</text>

    <rect x="690" y="470" width="550" height="225" rx="8" fill="#faf7ef" stroke="#c6b58c"/>
    <text x="715" y="501" font-size="19" font-weight="bold">Inputs that determine the initial state</text>
    <text x="715" y="534" font-size="15">v_z = 1 mm/s = 0.001 m/s</text>
    <text x="715" y="562" font-size="15">d_br,0 = 0.50 m; n0 = 0.40; c0 = 0.10; Fr0 = 2</text>
    <text x="715" y="590" font-size="15">q0 = v_z d_br,0 (1 - n0) / c0</text>
    <text x="715" y="618" font-size="15">h0 = [q0^2 / (epsilon0 g Fr0^2)]^(1/3)</text>
    <text x="715" y="646" font-size="15">epsilon0 = 0.141631; g = 9.81236 m/s2</text>
    <text x="715" y="674" font-size="14">v_z sets supply/erosion target; it is not mixture velocity u0.</text>

    <text x="700" y="737" font-size="15" font-weight="bold">Coordinate mapping used here</text>
    <text x="700" y="767" font-size="14">JSON y=0 crossing maps to the solver inlet.</text>
    <text x="700" y="793" font-size="14">X = x_JSON - x_crossing; z = y_JSON - d_br,0.</text>
    <text x="700" y="819" font-size="14">The above-datum segment is clipped, not integrated.</text>
    <text x="700" y="845" font-size="14">No calculated water-surface elevation is drawn.</text>
    <text x="40" y="880" font-size="13" fill="#555">Numerical labels are a snapshot of the example with Fr0=2, rho_s=2650 and rho_w=1000 kg/m3; this is not a computed flow profile.</text>
  </g>
</svg>
